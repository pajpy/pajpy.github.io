<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  {% if page.title == "Home" %}
    <link rel="stylesheet" href="{{ '/assets/css/index.css' | relative_url }}">
  {% elsif page.title == "Planets" %}
    <link rel="stylesheet" href="{{ '/assets/css/planets.css' | relative_url }}">
  {% elsif page.title == "Rockets" %}
    <link rel="stylesheet" href="{{ '/assets/css/rockets.css' | relative_url }}">
  {% endif %}
</head>
<body>
  <header>
    <h1>Space Explorer</h1>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/planets' | relative_url }}">Planets</a>
      <a href="{{ '/rockets' | relative_url }}">Rockets</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
